# Nginx Production Reverse Proxy Configuration for kekhaivtvl.hcmute.edu.vn -> utevtvl-app (127.0.0.1:3360)
# Promoted from verified Staging config (102 rps x 60s, keepalive 128, static cache, per-route body limits & rate-limit dry-run)

proxy_cache_path /var/cache/nginx/vtvl_static levels=1:2 keys_zone=vtvl_static_cache:16m max_size=512m inactive=30d use_temp_path=off;

limit_req_zone $binary_remote_addr zone=vtvl_auth_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=vtvl_api_ip:10m rate=150r/s;
limit_conn_zone $binary_remote_addr zone=vtvl_conn_ip:10m;

upstream utevtvl_prod_backend {
    server 127.0.0.1:3360 max_fails=0;
    keepalive 128;
    keepalive_timeout 4s;
    keepalive_requests 10000;
}

server {
    listen 80;
    listen [::]:80;
    server_name kekhaivtvl.hcmute.edu.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kekhaivtvl.hcmute.edu.vn;

    ssl_certificate /etc/letsencrypt/live/kekhaivtvl.hcmute.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kekhaivtvl.hcmute.edu.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Chế độ quan sát (`on`) để theo dõi lưu lượng thực tế trước khi bật chặn thật (`off`)
    limit_req_dry_run on;
    limit_conn_dry_run on;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    error_page 429 = @vtvl_rate_limited;
    error_page 413 = @vtvl_payload_too_large;

    location @vtvl_rate_limited {
        default_type application/json;
        add_header Retry-After 3 always;
        add_header Cache-Control "no-store" always;
        add_header X-RateLimit-Status $limit_req_status always;
        return 429 '{"error":"Lưu lượng yêu cầu vượt ngưỡng bảo vệ tạm thời. Vui lòng thử lại sau vài giây.","code":"NGINX_RATE_LIMITED"}';
    }

    location @vtvl_payload_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"error":"Dung lượng dữ liệu gửi lên vượt quá giới hạn cho phép tại reverse proxy.","code":"NGINX_PAYLOAD_TOO_LARGE"}';
    }

    # 1. Tài nguyên tĩnh có hash phiên bản (`/_next/static/`): bật proxy_cache dùng chung
    location /_next/static/ {
        proxy_pass http://utevtvl_prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache vtvl_static_cache;
        proxy_cache_valid 200 365d;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        add_header X-VTVL-Cache $upstream_cache_status always;
        expires 365d;
        access_log off;
    }

    # 1b. Healthchecks Liveness & Readiness: không cache, timeout ngắn, không log nhiễu
    location ~ ^/api/health/(live|ready)$ {
        access_log off;
        limit_req zone=vtvl_api_ip burst=60 nodelay;
        add_header Cache-Control "no-store" always;

        proxy_pass http://utevtvl_prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_connect_timeout 2s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
    }

    # 2. Nhóm xác thực mật khẩu: trần riêng theo IP & body tối đa 64KB
    location ~ ^/api/(auth/login|admin/auth|admin/c1-lock)$ {
        client_max_body_size 64k;
        limit_req zone=vtvl_auth_ip burst=30 nodelay;
        add_header X-RateLimit-Status $limit_req_status always;
        add_header Cache-Control "no-store" always;

        proxy_pass http://utevtvl_prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 3. Nhóm lưu & đồng bộ bảng tính workbook: trần 6MB
    location ~ ^/api/(workbooks|sync)/ {
        client_max_body_size 6m;
        limit_req zone=vtvl_api_ip burst=300 nodelay;
        limit_conn vtvl_conn_ip 400;
        add_header X-RateLimit-Status $limit_req_status always;
        add_header Cache-Control "no-store" always;

        proxy_pass http://utevtvl_prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 4. Các API nghiệp vụ & OAuth còn lại: trần 1MB, không cache
    location /api/ {
        client_max_body_size 1m;
        limit_req zone=vtvl_api_ip burst=300 nodelay;
        limit_conn vtvl_conn_ip 400;
        add_header X-RateLimit-Status $limit_req_status always;
        add_header Cache-Control "no-store" always;

        proxy_pass http://utevtvl_prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }

    # 5. Trang ứng dụng HTML/RSC: tái sử dụng keepalive pool, không cache dùng chung
    location / {
        client_max_body_size 1m;
        limit_req zone=vtvl_api_ip burst=300 nodelay;
        add_header X-RateLimit-Status $limit_req_status always;

        proxy_pass http://utevtvl_prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
