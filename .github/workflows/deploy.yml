name: Auto Deploy HCM-UTE VTVL 360 to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy-utevtvl
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, Migrate Prisma/PostgreSQL & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger ./deploy.sh on Production VPS via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 12m
          script: |
            set -e
            TARGET_DIR="${{ secrets.WORK_DIR || '/root/ute.vtvl' }}"
            cd "$TARGET_DIR"
            chmod +x deploy.sh
            ./deploy.sh

