# Staging Server Block cho kekhaivtvl.hcmute.edu.vn (Local/Staging Port 8360 -> 127.0.0.1:3369)
# Trên VPS Production sau khi duyệt:
# - Đổi `listen` sang `443 ssl http2`, bổ sung chứng chỉ Let's Encrypt & thêm `limit_req_dry_run off;`
# - Đổi `utevtvl_staging_backend` về `127.0.0.1:3360` và tạo thư mục `/var/cache/nginx/vtvl_static`

server {
    listen 127.0.0.1:8360;
    server_name kekhaivtvl.hcmute.edu.vn localhost;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Mặc định chạy chế độ quan sát (`on`) để đo lưu lượng hợp lệ trước khi bật chặn thật (`off`)
    limit_req_dry_run on;
    limit_conn_dry_run on;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    error_page 429 = @vtvl_rate_limited;
    error_page 413 = @vtvl_payload_too_large;

    location @vtvl_rate_limited {
        default_type application/json;
        add_header Retry-After 3 always;
        add_header Cache-Control "no-store" always;
        add_header X-RateLimit-Status $limit_req_status always;
        return 429 '{"error":"Lưu lượng yêu cầu vượt ngưỡng bảo vệ tạm thời. Vui lòng thử lại sau vài giây.","code":"NGINX_RATE_LIMITED"}';
    }

    location @vtvl_payload_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"error":"Dung lượng dữ liệu gửi lên vượt quá giới hạn cho phép tại reverse proxy.","code":"NGINX_PAYLOAD_TOO_LARGE"}';
    }

    # 1. Tài nguyên tĩnh công khai có mã băm phiên bản (`/_next/static/`): ĐƯỢC PHÉP cache dùng chung
    location /_next/static/ {
        proxy_pass http://utevtvl_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_cache vtvl_static_cache;
        proxy_cache_valid 200 365d;
        proxy_ignore_headers Set-Cookie Cache-Control Expires;
        proxy_hide_header Set-Cookie;
        add_header X-VTVL-Cache $upstream_cache_status always;
        expires 365d;
        access_log off;
    }

    # 1b. Healthchecks Liveness & Readiness: KHÔNG cache, timeout ngắn, không log nhiễu
    location ~ ^/api/health/(live|ready)$ {
        access_log off;
        limit_req zone=vtvl_api_ip burst=60 nodelay;
        add_header Cache-Control "no-store" always;

        proxy_pass http://utevtvl_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_connect_timeout 2s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
    }

    # 2. Nhóm xác thực mật khẩu: trần riêng theo IP ($binary_remote_addr) & body tối đa 64KB
    location ~ ^/api/(auth/login|admin/auth|admin/c1-lock)$ {
        client_max_body_size 64k;
        limit_req zone=vtvl_auth_ip burst=30 nodelay;
        add_header X-RateLimit-Status $limit_req_status always;
        add_header Cache-Control "no-store" always;

        proxy_pass http://utevtvl_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 3. Nhóm lưu & đồng bộ bảng tính workbook: trần 6MB (hợp lệ lớn 1000 việc ~1.23MB)
    location ~ ^/api/(workbooks|sync)/ {
        client_max_body_size 6m;
        limit_req zone=vtvl_api_ip burst=300 nodelay;
        limit_conn vtvl_conn_ip 400;
        add_header X-RateLimit-Status $limit_req_status always;
        add_header Cache-Control "no-store" always;

        proxy_pass http://utevtvl_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 4. Các API nghiệp vụ & OAuth còn lại: trần 1MB, ngoài cache dùng chung
    location /api/ {
        client_max_body_size 1m;
        limit_req zone=vtvl_api_ip burst=300 nodelay;
        limit_conn vtvl_conn_ip 400;
        add_header X-RateLimit-Status $limit_req_status always;
        add_header Cache-Control "no-store" always;

        proxy_pass http://utevtvl_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }

    # 5. Trang ứng dụng HTML/RSC: KHÔNG cache dùng chung
    location / {
        client_max_body_size 1m;
        limit_req zone=vtvl_api_ip burst=300 nodelay;
        add_header X-RateLimit-Status $limit_req_status always;

        proxy_pass http://utevtvl_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
